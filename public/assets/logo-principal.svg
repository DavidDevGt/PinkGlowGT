    <path d="M 125 70 C 140 110 155 140 165 160" fill="none" stroke="#E7107A" stroke-width="6" stroke-linecap="round" />

    <!-- Left Cherry -->
    <circle cx="75" cy="180" r="34" fill="#E7107A" />
    <path d="M 58 165 C 54 175 58 190 68 195 C 62 190 60 178 64 168 Z" fill="#FFFFFF" opacity="0.85" />

    <!-- Right Cherry -->
    <circle cx="175" cy="180" r="34" fill="#E7107A" />
    <path d="M 192 165 C 196 175 192 190 182 195 C 188 190 190 178 186 168 Z" fill="#FFFFFF" opacity="0.85" />
