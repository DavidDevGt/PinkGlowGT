  <text x="250" y="200" font-family="'Playfair Display', Georgia, serif" font-size="86" font-weight="700" fill="#0A2E58" text-anchor="middle" letter-spacing="6">GLOW</text>

  <!-- Cherries -->
  <g transform="translate(250, 280) scale(0.65) translate(-125, -125)">
    <!-- Leaves -->
