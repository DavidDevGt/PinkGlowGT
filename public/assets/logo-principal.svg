  <!-- MAKEUP • PERFUME subtitle -->
  <text x="250" y="355" font-family="'Montserrat', sans-serif" font-size="19" font-weight="600" fill="#E7107A" text-anchor="middle" letter-spacing="11">MAKEUP • PERFUME</text>
