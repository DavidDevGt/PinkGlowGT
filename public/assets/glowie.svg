<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cherryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B9D" />
      <stop offset="50%" stop-color="#E7107A" />
      <stop offset="100%" stop-color="#BA005B" />
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBF2" />
      <stop offset="100%" stop-color="#FFB3CD" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E7107A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Arms -->
  <path d="M 125 320 C 85 340 70 305 90 290" fill="none" stroke="#BA005B" stroke-width="9" stroke-linecap="round" />
  <circle cx="92" cy="288" r="6" fill="#BA005B" />

  <path d="M 375 325 C 415 350 435 340 420 370" fill="none" stroke="#BA005B" stroke-width="9" stroke-linecap="round" />
  <circle cx="420" cy="370" r="6" fill="#BA005B" />

  <!-- Legs -->
  <path d="M 215 410 L 210 470 C 210 478 190 478 190 470" fill="none" stroke="#BA005B" stroke-width="9" stroke-linecap="round" />
  <ellipse cx="200" cy="470" rx="12" ry="7" fill="#BA005B" />

  <path d="M 285 410 L 295 470 C 295 478 315 478 315 470" fill="none" stroke="#BA005B" stroke-width="9" stroke-linecap="round" />
  <ellipse cx="305" cy="470" rx="12" ry="7" fill="#BA005B" />

  <!-- Cherry Stems from top -->
  <path d="M 220 185 Q 200 130 225 105" fill="none" stroke="#0A2E58" stroke-width="12" stroke-linecap="round" />
  <path d="M 280 185 Q 300 130 275 105" fill="none" stroke="#0A2E58" stroke-width="12" stroke-linecap="round" />

  <!-- Cute Bow -->
  <g id="bow">
    <!-- Left loop -->
    <path d="M 250 85 C 200 50 160 70 165 110 C 170 145 220 120 250 95 Z" fill="url(#bowGrad)" stroke="#E7107A" stroke-width="3.5" />
    <!-- Left loop fold -->
    <path d="M 195 90 C 210 95 220 105 230 102" fill="none" stroke="#F87B9A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right loop -->
    <path d="M 250 85 C 300 50 340 70 335 110 C 330 145 280 120 250 95 Z" fill="url(#bowGrad)" stroke="#E7107A" stroke-width="3.5" />
    <!-- Right loop fold -->
    <path d="M 305 90 C 290 95 280 105 270 102" fill="none" stroke="#F87B9A" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center knot -->
    <rect x="236" y="76" width="28" height="32" rx="10" fill="#FFA5C3" stroke="#E7107A" stroke-width="3.5" />
    <path d="M 245 82 L 245 102" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Heart Cherry Body -->
  <g filter="url(#softGlow)">
    <path d="M 250 205
             C 210 160 130 155 115 230
             C 100 305 180 375 250 415
             C 320 375 400 305 385 230
             C 370 155 290 160 250 205 Z"
          fill="url(#cherryGrad)" stroke="#BA005B" stroke-width="6" />
  </g>

  <!-- Big 3D glossy highlight on upper left curve -->
  <path d="M 140 215 C 150 185 195 180 220 195 C 190 200 155 220 145 245 C 140 240 138 225 140 215 Z" fill="#FFFFFF" opacity="0.75" />
  <ellipse cx="140" cy="260" rx="9" ry="16" transform="rotate(-20 140 260)" fill="#FFFFFF" opacity="0.65" />
  
  <!-- Subtle highlight on right curve -->
  <ellipse cx="360" cy="235" rx="7" ry="14" transform="rotate(25 360 235)" fill="#FFFFFF" opacity="0.55" />

  <!-- Left Kawaii Eye (Open, with star catchlight) -->
  <ellipse cx="195" cy="285" rx="17" ry="22" fill="#0A2E58" />
  <circle cx="190" cy="275" r="7" fill="#FFFFFF" />
  <circle cx="202" cy="293" r="3.5" fill="#FFFFFF" />
  <!-- Eyelashes -->
  <path d="M 180 270 Q 170 265 165 272" fill="none" stroke="#0A2E58" stroke-width="3" stroke-linecap="round" />
  <path d="M 183 263 Q 176 254 172 258" fill="none" stroke="#0A2E58" stroke-width="3" stroke-linecap="round" />

  <!-- Right Eye (Winking Arch with Lashes) -->
  <path d="M 285 285 Q 310 265 330 288" fill="none" stroke="#0A2E58" stroke-width="5" stroke-linecap="round" />
  <path d="M 330 280 Q 342 278 346 285" fill="none" stroke="#0A2E58" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 324 273 Q 335 266 339 270" fill="none" stroke="#0A2E58" stroke-width="3.5" stroke-linecap="round" />

  <!-- Rosy Cheeks -->
  <ellipse cx="160" cy="315" rx="16" ry="11" fill="#FF5E9B" opacity="0.8" />
  <ellipse cx="335" cy="315" rx="16" ry="11" fill="#FF5E9B" opacity="0.8" />

  <!-- Happy Open Mouth -->
  <path d="M 235 315 Q 250 310 265 315 Q 268 342 250 345 Q 232 342 235 315 Z" fill="#6A0C38" />
  <path d="M 240 330 Q 250 322 260 330 Q 256 342 250 343 Q 244 342 240 330 Z" fill="#FF8CB8" />

  <!-- Sparkles around Glowie -->
  <g fill="#FFAEC9" opacity="0.9">
    <path d="M 80 180 Q 95 180 95 165 Q 95 180 110 180 Q 95 180 95 195 Q 95 180 80 180 Z" />
    <path d="M 400 160 Q 412 160 412 148 Q 412 160 424 160 Q 412 160 412 172 Q 412 160 400 160 Z" />
    <path d="M 380 390 Q 390 390 390 380 Q 390 390 400 390 Q 390 390 390 400 Q 390 390 380 390 Z" />
  </g>
</svg>
